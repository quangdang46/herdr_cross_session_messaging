[package]
name = "herdr-routerd"
description = "Router daemon for herdr-cross-session-messaging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["herdr", "daemon", "messaging", "router"]
categories = ["command-line-utilities"]
# Depends on publish=false crates; install via `cargo install --git` or
# GitHub release binaries instead. See CHANGELOG.
publish = false

[[bin]]
name = "herdr-routerd"
path = "src/main.rs"

[dependencies]
herdr-router.workspace = true
herdr-plugin.workspace = true
herdr-runtime.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
