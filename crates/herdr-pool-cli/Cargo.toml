[package]
name = "herdr-pool-cli"
description = "herdr-pool CLI: peer-to-peer messaging for coding agents inside Herdr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["herdr", "cli", "messaging", "agents", "inbox"]
categories = ["command-line-utilities"]
# Depends on publish=false crates + dev-dep herdr-testkit; install via
# `cargo install --git` or GitHub release binaries instead. See CHANGELOG.
publish = false

[[bin]]
name = "herdr-pool"
path = "src/main.rs"

[dependencies]
herdr-protocol.workspace = true
herdr-pool-core.workspace = true
herdr-pool-store.workspace = true
herdr-plugin.workspace = true
herdr-router.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
time.workspace = true
crossterm = "0.28"

[dev-dependencies]
herdr-testkit.workspace = true
tempfile.workspace = true
