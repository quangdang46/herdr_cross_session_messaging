id = "herdr.cross-session-messaging"
name = "Cross-Session Messaging"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Peer-to-peer messaging layer for coding agents in Herdr (project-scoped pools, herdr-pool CLI, agent skills)."
# Windows is excluded: the Herdr socket transport there is a named pipe,
# which herdr-protocol does not implement yet.
platforms = ["linux", "macos"]

# `herdr plugin install` runs these once; they put `herdr-pool` and
# `herdr-routerd` on PATH (~/.cargo/bin) so startup/actions/panes and the
# agent-facing skill can all resolve them. Requires a Rust toolchain.
[[build]]
command = ["cargo", "install", "--path", "crates/herdr-pool-cli", "--locked"]

[[build]]
command = ["cargo", "install", "--path", "crates/herdr-routerd", "--locked"]

[[startup]]
command = ["herdr-routerd", "start"]

[[actions]]
id = "open-inbox"
title = "Messaging inbox"
contexts = ["workspace"]
# Actions run headless — delegate to `plugin pane open` so invoking this
# action actually shows the popup entrypoint.
command = ["herdr", "plugin", "pane", "open", "--plugin", "herdr.cross-session-messaging", "--entrypoint", "inbox"]

# Left-docked inbox panel: `herdr-pool panel toggle` opens it as a narrow
# left split in the current tab (close when focused, focus when open).
# Bind a key in config.toml: `herdr plugin action invoke panel-toggle`.
[[actions]]
id = "panel-toggle"
title = "Toggle messaging panel"
contexts = ["workspace"]
command = ["herdr-pool", "panel", "toggle"]

[[panes]]
id = "inbox"
title = "Messaging inbox"
platforms = ["linux", "macos"]
placement = "popup"
width = "80%"
height = 20
command = ["herdr-pool", "inbox", "--follow"]

# Left-docked panel entrypoint (opened via `plugin.pane.open` by
# `herdr-pool panel`, never directly by users).
[[panes]]
id = "panel"
title = "Pool"
platforms = ["linux", "macos"]
placement = "split"
command = ["herdr-pool", "inbox", "--follow"]

# Panel autostart (`[panel] autostart` in config.toml): dock the inbox
# panel into each newly created tab/workspace. `panel ensure` no-ops when
# the setting is off, so these hooks are cheap when disabled.
[[events]]
on = "tab.created"
platforms = ["linux", "macos"]
command = ["herdr-pool", "panel", "ensure"]

[[events]]
on = "workspace.created"
platforms = ["linux", "macos"]
command = ["herdr-pool", "panel", "ensure"]
